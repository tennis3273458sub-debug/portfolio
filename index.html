<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OKINAWA TRAVEL | 沖縄観光ガイド</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ヘッダー＆ナビゲーション -->
    <header class="navbar">
        <div class="logo">OKINAWA TRAVEL</div>
        <nav>
            <a href="index.html" class="active">ホーム</a>
            <a href="spots.html">スポット一覧</a>
        </nav>
    </header>

    <!-- メインビジュアル -->
    <div class="hero">
        <h1>青い海と豊かな自然に出会う旅</h1>
        <button onclick="addSpot()" class="btn-primary">おすすめスポットを追加</button>
    </div>

    <!-- コンテンツカード -->
    <div class="container" id="spot-container">
        <div class="card">
            <img class="site-image" src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=800" alt="古宇利島">
            <div class="content">
                <span class="tag">北部エリア</span>
                <h2>古宇利大橋</h2>
                <p>エメラルドグリーンの海を渡る絶景ドライブコース。橋を渡った先にはハートロックなどの名所が広がります。</p>
            </div>
        </div>

        <div class="card">
            <img class="site-image" src="https://images.unsplash.com/photo-1545569341-9eb8b30979d9?w=800" alt="美ら海水族館">
            <div class="content">
                <span class="tag">本部エリア</span>
                <h2>沖縄美ら海水族館</h2>
                <p>巨大水槽「黒潮の海」で泳ぐジンベエザメやマンタは圧巻。沖縄の海の神秘を間近で体感できます。</p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
