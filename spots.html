<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>スポット一覧 | OKINAWA TRAVEL</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="navbar">
        <div class="logo">OKINAWA TRAVEL</div>
        <nav>
            <a href="index.html">ホーム</a>
            <a href="spots.html" class="active">スポット一覧</a>
        </nav>
    </header>

    <div class="header" style="text-align: center; margin: 40px 0;">
        <h1 class="fade-in-target" style="color: #fff; font-size: 28px;">沖縄の厳選グルメ＆人気スポット</h1>
    </div>

    <div class="container">
        <div class="card fade-in-target">
            <img class="site-image" src="https://images.unsplash.com/photo-1569718212165-3a8278d5f624?w=800" alt="沖縄そば">
            <div class="content">
                <span class="tag">グルメ</span>
                <h2>伝統のソーキそば</h2>
                <p>じっくり煮込んだ豚あばら肉（ソーキ）と出汁の効いたスープが絶品。沖縄を訪れたら絶対に味わいたい名物料理です。</p>
            </div>
        </div>

        <div class="card fade-in-target">
            <img class="site-image" src="https://images.unsplash.com/photo-1519046904884-53103b34b206?w=800" alt="国際通り">
            <div class="content">
                <span class="tag">那覇エリア</span>
                <h2>国際通り</h2>
                <p>お土産店や飲食店が軒を連ねる沖縄一のメインストリート。夜遅くまで賑わう観光の中心地です。</p>
            </div>
        </div>
    </div>
